<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mật khẩu đã được thay đổi</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #2980b9;">Mật khẩu đã được thay đổi</h2>
    <p>Xin chào <span th:text="${fullname}">User</span>,</p>
    <p>Mật khẩu tài khoản <strong th:text="${username}">username</strong> của bạn vừa được thay đổi thành công.</p>

    <div style="background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 20px 0;">
        <p>Nếu bạn <strong>không thực hiện</strong> thao tác này, vui lòng liên hệ quản trị viên ngay để được hỗ trợ bảo mật tài khoản.</p>
    </div>

    <p style="margin-top: 30px;">Trân trọng,<br><strong>Đội ngũ CloudDB</strong></p>
</div>
</body>
</html>
