<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tài khoản bị chặn</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #c0392b;">Tài khoản của bạn đã bị chặn</h2>
    <p>Xin chào <span th:text="${fullname}">User</span>,</p>
    <p>Tài khoản <strong th:text="${username}">username</strong> của bạn đã bị quản trị viên chặn.</p>

    <div style="background: #fdecea; padding: 15px; border-radius: 8px; margin: 20px 0; border-left: 4px solid #c0392b;">
        <p><strong>Lý do:</strong></p>
        <p th:text="${banReason}">Lý do chặn</p>
    </div>

    <p>Nếu bạn cho rằng đây là nhầm lẫn, vui lòng liên hệ quản trị viên để được hỗ trợ.</p>
    <p style="margin-top: 30px;">Trân trọng,<br><strong>Đội ngũ CloudDB</strong></p>
</div>
</body>
</html>
